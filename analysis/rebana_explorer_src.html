<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Powering Rebana explorer: Rebana facts, PLN operational data, 2030 projections and work-package ideas for the 2nd Powering Rebana Workshop (Cirebon, 5-6 Nov 2026).">
<title>Powering Rebana Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: one screen per chapter; vertical chapter rail on the left, stage in the middle, arrows bottom-right. */
:root{
  --bg:#F6F4EE; --panel:#FFFFFF; --fg:#13263A; --muted:#55606E; --line:#DAD6CB; --soft:#ECE8DD;
  --accent:#C97D0E; --s1:#0F9A96; --s2:#C97D0E; --s3:#7B5EA7; --s4:#C0392B; --ok:#1E8E5A; --warn:#C97D0E; --bad:#C0392B;
  --navy:#0F2A3D; --navyfg:#F6F4EE; --grid:#E3DFD3;
  --fd:'Domine',Georgia,serif; --fs:'IBM Plex Sans',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1B26; --panel:#15283A; --fg:#EDEBE4; --muted:#A7B3BE; --line:#28405A; --soft:#1B3146;
  --accent:#C4821C; --s1:#2FA9A6; --s2:#C4821C; --s3:#9C82D0; --s4:#DC5F4F; --ok:#3DBB7E; --warn:#C4821C; --bad:#DC5F4F;
  --navy:#0A1823; --navyfg:#EDEBE4; --grid:#243A50; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1B26; --panel:#15283A; --fg:#EDEBE4; --muted:#A7B3BE; --line:#28405A; --soft:#1B3146;
  --accent:#C4821C; --s1:#2FA9A6; --s2:#C4821C; --s3:#9C82D0; --s4:#DC5F4F; --ok:#3DBB7E; --warn:#C4821C; --bad:#DC5F4F;
  --navy:#0A1823; --navyfg:#EDEBE4; --grid:#243A50; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fs);font-size:15px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{min-width:0;display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:1px solid var(--line)}
header .brand{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:.2px}
header .brand span{color:var(--accent)}
header .meta{color:var(--muted);font-size:12.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);font:600 12.5px var(--fs);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
main{min-width:0;display:grid;grid-template-columns:200px 1fr;gap:18px;min-height:0;padding-block:14px}
nav.rail{min-width:0;display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0;padding-right:4px}
nav.rail button{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--muted);font:500 12.5px var(--fs);text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;line-height:1.2}
nav.rail button i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transition:transform .3s,background .3s}
nav.rail button[aria-current="true"]{color:var(--fg);background:var(--soft)}
nav.rail button[aria-current="true"] i{background:var(--accent);transform:scale(1.4)}
nav.rail button:focus-visible{outline:2px solid var(--accent)}
nav.rail .part{font:600 10.5px var(--fs);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
#stage{position:relative;min-height:0;min-width:0}
.chapter{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;gap:12px;opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .45s ease;pointer-events:none;overflow:auto;min-width:0}
.chapter.active{opacity:1;transform:none;pointer-events:auto}
.chead{display:flex;flex-direction:column;gap:4px}
.eyebrow{font:600 11.5px var(--fs);letter-spacing:2px;text-transform:uppercase;color:var(--s1)}
h1,h2{font-family:var(--fd);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:clamp(20px,2.4vw,30px)}
h1{font-size:clamp(28px,4vw,54px)}
h3{font:600 14px var(--fs);margin:0}
p{margin:0}
.lead{color:var(--muted);font-size:clamp(13px,1.2vw,16px);max-width:70ch}
.body{display:grid;gap:14px;min-height:0;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:8px}
.card.navy{background:var(--navy);color:var(--navyfg);border-color:transparent}
.card.navy .muted,.card.navy .lbl{color:#BFD8D5}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .num{font-family:var(--fd);font-weight:700;font-size:clamp(22px,2.6vw,36px);line-height:1.05;font-variant-numeric:tabular-nums;color:var(--fg)}
.tile .num.acc{color:var(--accent)}
.tile .lbl,.lbl{font-size:12px;color:var(--muted);line-height:1.3}
.muted{color:var(--muted)}
.src{font-size:11.5px;color:var(--muted);line-height:1.35}
.rise{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i,0)*90ms)}
.active .rise{opacity:1;transform:none}
.bar{height:100%;border-radius:4px;transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*60ms)}
.active .bar{transform:scaleX(1)}
.vbar{width:100%;border-radius:4px 4px 0 0;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*40ms)}
.active .vbar{transform:scaleY(1)}
.hrow{display:grid;grid-template-columns:minmax(80px,1fr) 3fr auto;gap:10px;align-items:center;font-size:13px}
.hrow .track{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.hrow .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.3px}
td.r,th.r{text-align:right}
.tw{overflow:auto;min-width:0}
svg{max-width:100%;display:block}
.map path{fill:var(--soft);stroke:var(--bg);stroke-width:1.2;transition:fill .6s;cursor:pointer}
.map path:hover{stroke:var(--fg)}
.map .dot{fill:var(--s2);stroke:var(--bg);stroke-width:.6;opacity:0;transition:opacity .4s}
.active .map .dot{opacity:.9}
.map text{font:600 10px var(--fs);fill:var(--fg);pointer-events:none}
.tip{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;max-width:260px;display:none}
.tip b{display:block;margin-bottom:3px}
.tip .k{color:var(--muted)}
footer{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.arrows{display:flex;gap:6px}
.arrows button{width:38px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font-size:16px}
.arrows button:disabled{opacity:.35;cursor:default}
.arrows button:focus-visible{outline:2px solid var(--accent)}
.prog{flex:1;height:3px;background:var(--soft);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--line);color:var(--muted);width:max-content}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--warn);border-color:var(--warn)} .pill.bad{color:var(--bad);border-color:var(--bad)}
.gauge{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.gauge svg{width:92px;height:92px}
.gauge .arc{fill:none;stroke-width:9;stroke-linecap:round}
.gauge .bgarc{stroke:var(--soft)}
.gauge .fgarc{stroke:var(--s1);stroke-dasharray:1 1000;transition:stroke-dasharray 1.1s cubic-bezier(.2,.7,.2,1)}
.gauge .gnum{font:700 15px var(--fd);fill:var(--fg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:5px 12px;font:600 12.5px var(--fs);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.slider{display:grid;gap:4px;font-size:12.5px}
.slider label{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.slider label b{color:var(--fg);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.big{font-family:var(--fd);font-weight:700;font-size:clamp(26px,3vw,44px);line-height:1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.kv.two{grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;font-size:12px}
ul.clean{margin:0;padding-left:18px;font-size:13px;display:grid;gap:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.timeline .step{border-top:3px solid var(--s1);padding-top:6px;font-size:12.5px}
.timeline .step b{display:block;font-size:13px}
.ph{color:var(--accent);font-weight:600}

/* ---------- small d3 helpers for the sales infographic ---------- */
function cumChart(box){
  box.innerHTML=''; const S=D.sales.cum; const W=Math.max(300,box.clientWidth||520), H=Math.max(180,Math.min(260,box.clientHeight||210)), m={l:44,r:98,t:14,b:24};
  const svg=d3.select(box).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%').attr('role','img').attr('aria-label','Cumulative energy sales, UP3 Indramayu');
  const x=d3.scalePoint().domain(d3.range(9)).range([m.l,W-m.r]); const y=d3.scaleLinear().domain([0,1300]).range([H-m.b,m.t]);
  const MO=lang==='id'?['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep']:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep'];
  y.ticks(4).forEach(v=>{ svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(v)).attr('y2',y(v)).attr('stroke',css('--grid')); svg.append('text').attr('x',m.l-6).attr('y',y(v)+4).attr('text-anchor','end').attr('fill',css('--muted')).style('font-size','11px').text(nf(v)); });
  MO.forEach((mo,i)=>svg.append('text').attr('x',x(i)).attr('y',H-6).attr('text-anchor','middle').attr('fill',css('--muted')).style('font-size','11px').text(mo));
  const line=d3.line().x((d,i)=>x(i)).y(d=>y(d));
  [['2024','--muted'],['2026','--s1']].forEach(([k,c])=>{ const p=svg.append('path').attr('d',line(S[k])).attr('fill','none').attr('stroke',css(c)).attr('stroke-width',k==='2026'?3:2).attr('stroke-linecap','round').attr('stroke-linejoin','round');
    const L0=p.node().getTotalLength(); if(!reduce()) p.attr('stroke-dasharray',`${L0} ${L0}`).attr('stroke-dashoffset',L0).transition().duration(1400).ease(d3.easeCubicOut).attr('stroke-dashoffset',0);
    svg.append('circle').attr('cx',x(8)).attr('cy',y(S[k][8])).attr('r',4.5).attr('fill',css(c)).attr('stroke',css('--panel')).attr('stroke-width',2);
    svg.append('text').attr('x',x(8)+8).attr('y',y(S[k][8])+(k==='2026'?-2:12)).attr('fill',css('--fg')).style('font-size','11.5px').style('font-weight',600).text(`${k} ${nf(S[k][8],1)}`); });
  svg.append('circle').attr('cx',x(8)).attr('cy',y(S['2025'][8])).attr('r',4.5).attr('fill',css('--s3')).attr('stroke',css('--panel')).attr('stroke-width',2);
  svg.append('text').attr('x',x(8)+8).attr('y',y(S['2025'][8])+5).attr('fill',css('--fg')).style('font-size','11.5px').style('font-weight',600).text(`2025 ${nf(S['2025'][8],1)}`);
  const hov=svg.append('line').attr('y1',m.t).attr('y2',H-m.b).attr('stroke',css('--line')).style('opacity',0);
  svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',H-m.t-m.b).attr('fill','transparent')
   .on('mousemove',e=>{ const [px]=d3.pointer(e); const i=Math.max(0,Math.min(8,Math.round((px-m.l)/((W-m.l-m.r)/8)))); hov.attr('x1',x(i)).attr('x2',x(i)).style('opacity',1);
     const mon=k=>i===0?S[k][0]:S[k][i]-S[k][i-1]; showTip(e,`<b>${MO[i]}</b>2026: ${nf(S['2026'][i],2)} GWh <span class="k">(${t({en:'month',id:'bulan'})} ${nf(mon('2026'),2)})</span><br>2024: ${nf(S['2024'][i],2)} GWh <span class="k">(${t({en:'month',id:'bulan'})} ${nf(mon('2024'),2)})</span>${i===8?`<br>2025: ${nf(S['2025'][8],2)} GWh`:''}`); })
   .on('mouseleave',()=>{ hov.style('opacity',0); hideTip(); });
}
function dumbbell(box){
  box.innerHTML=''; const rows=D.sales.cluster.filter(r=>r[0]!=='Other').sort((a,b)=>b[2]-a[2]); const W=Math.max(300,box.clientWidth||420), rh=20, m={l:118,r:58,t:6,b:18}; const H=m.t+m.b+rh*rows.length;
  const NM={Plastics:'Plastik',Ceramics:'Keramik','Oil & gas':'Minyak & gas','Mall & dept. store':'Mal & toserba',Hospitals:'Rumah sakit',Footwear:'Sepatu','Rice mills':'Penggilingan beras',Schools:'Sekolah',Textiles:'Tekstil',Offices:'Perkantoran',Hotels:'Hotel'};
  const svg=d3.select(box).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%').attr('role','img').attr('aria-label','Industrial cluster sales 2025 vs 2026');
  const x=d3.scaleLinear().domain([0,120]).range([m.l,W-m.r]);
  [0,40,80,120].forEach(v=>{ svg.append('line').attr('x1',x(v)).attr('x2',x(v)).attr('y1',m.t).attr('y2',H-m.b).attr('stroke',css('--grid')); svg.append('text').attr('x',x(v)).attr('y',H-4).attr('text-anchor','middle').attr('fill',css('--muted')).style('font-size','10.5px').text(nf(v)); });
  rows.forEach((r,i)=>{ const cy=m.t+rh*i+rh/2, d=r[2]-r[1];
    svg.append('text').attr('x',m.l-8).attr('y',cy+4).attr('text-anchor','end').attr('fill',css('--fg')).style('font-size','11.5px').text(lang==='id'?(NM[r[0]]||r[0]):r[0]);
    const ln=svg.append('line').attr('x1',x(r[1])).attr('x2',x(r[1])).attr('y1',cy).attr('y2',cy).attr('stroke',css(d>=0?'--s1':'--s4')).attr('stroke-width',3).attr('stroke-linecap','round');
    ln.transition().delay(i*70).duration(reduce()?0:800).attr('x2',x(r[2]));
    svg.append('circle').attr('cx',x(r[1])).attr('cy',cy).attr('r',4.5).attr('fill',css('--muted'));
    svg.append('circle').attr('cx',x(r[1])).attr('cy',cy).attr('r',5.5).attr('fill',css(d>=0?'--s1':'--s4')).attr('stroke',css('--panel')).attr('stroke-width',1.5).transition().delay(i*70).duration(reduce()?0:800).attr('cx',x(r[2]));
    svg.append('text').attr('x',W-m.r+6).attr('y',cy+4).attr('fill',css(d>=0?'--fg':'--bad')).style('font-size','11px').style('font-weight',600).text((d>=0?'+':'')+nf(d,2));
    svg.append('rect').attr('x',0).attr('y',cy-rh/2).attr('width',W).attr('height',rh).attr('fill','transparent').on('mousemove',e=>showTip(e,`<b>${lang==='id'?(NM[r[0]]||r[0]):r[0]}</b>Jan–Sep 2025: ${nf(r[1],2)} GWh<br>Jan–Sep 2026: ${nf(r[2],2)} GWh<br>${(d>=0?'+':'')+nf(d,2)} GWh`)).on('mouseleave',hideTip); });
}

function drawTreemap(box){ box.innerHTML=''; const W=box.clientWidth||600, H=Math.max(220,box.clientHeight||300); const rest=11434/5; const data={children:D.zones.map(z=>({name:z.zone,reg:z.regency,ha:z.area_ha||rest,np:!z.area_ha}))}; const root=d3.hierarchy(data).sum(d=>d.ha).sort((a,b)=>b.value-a.value); d3.treemap().size([W,H]).paddingInner(3)(root); const svg=d3.select(box).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('role','img').attr('aria-label','Treemap of the 13 zones by area');
  const defs=svg.append('defs'); const pat=defs.append('pattern').attr('id','hatch').attr('width',6).attr('height',6).attr('patternUnits','userSpaceOnUse').attr('patternTransform','rotate(45)'); pat.append('rect').attr('width',6).attr('height',6).attr('fill',css('--bg')); pat.append('rect').attr('width',2).attr('height',6).attr('fill',css('--muted')).attr('opacity',.5);
  const g=svg.selectAll('g').data(root.leaves()).join('g').attr('transform',d=>`translate(${d.x0},${d.y0})`);
  const col=d=>{ const r=d.data.reg; return r.includes('Subang')?'--s1':r.includes('Indramayu')?'--s2':r.includes('Majalengka')?'--s3':'--s4'; };
  g.append('rect').attr('width',d=>d.x1-d.x0).attr('height',d=>d.y1-d.y0).attr('rx',4).attr('fill',d=>d.data.np?'url(#hatch)':`var(${col(d)})`).attr('stroke',d=>d.data.np?`var(${col(d)})`:'none').attr('stroke-width',1.5).style('opacity',0).transition().delay((d,i)=>i*60).duration(500).style('opacity',1);
  g.append('text').attr('x',6).attr('y',16).style('font',`600 ${12}px var(--fs)`).style('fill',d=>d.data.np?css('--fg'):'#FFFFFF').text(d=>(d.x1-d.x0)>70?d.data.name:'');
  g.append('text').attr('x',6).attr('y',31).style('font',`${11}px var(--fs)`).style('fill',d=>d.data.np?css('--muted'):'#FFFFFF').style('opacity',.9).text(d=>(d.x1-d.x0)>70&&(d.y1-d.y0)>36?(d.data.np?'n/p':nf(d.data.ha)+' ha'):'');
  g.on('mousemove',(e,d)=>showTip(e,`<b>${d.data.name}</b>${d.data.reg}<br>${d.data.np?t({en:'area not published (drawn at 1/5 of the unassigned 11,434 ha)',id:'luas belum terbit (digambar 1/5 dari 11.434 ha yang belum dialokasikan)'}):nf(d.data.ha)+' ha'}`)).on('mouseleave',hideTip);
}

/* ---------- app ---------- */
const stage=document.getElementById('stage'), rail=document.getElementById('rail');
let cur=0; const panels=[];
function build(){ panels.forEach(p=>p.remove()); panels.length=0; rail.innerHTML=''; let lastPart=-1;
  CH.forEach((c,i)=>{ if(c.part!==lastPart){ rail.append(el('div','part',t(C.parts[c.part]))); lastPart=c.part; } const bt=el('button',null,`<i></i><span>${t(c.nav)}</span>`); bt.addEventListener('click',()=>go(i)); rail.append(bt);
    const p=el('section','chapter'); p.id='ch-'+c.id; p.setAttribute('aria-hidden','true'); stage.append(p); panels.push(p); });
  document.getElementById('hmeta').textContent=t(C.header); document.getElementById('fnote').textContent=t(C.fnote);
  document.getElementById('lang-en').setAttribute('aria-pressed',String(lang==='en')); document.getElementById('lang-id').setAttribute('aria-pressed',String(lang==='id'));
  show(cur,true); }
function show(i,force){ panels.forEach((p,j)=>{ if(j===i){ if(force||!p.dataset.built){ p.querySelectorAll('.lmap').forEach(m=>m._lmap&&m._lmap.remove()); p.innerHTML=''; CH[i].render(p); p.dataset.built='1'; p.style.gridTemplateRows=[...p.children].map(c=>c.classList.contains('body')?'minmax(min-content,1fr)':'auto').join(' '); }
 setTimeout(()=>p.querySelectorAll('.lmap').forEach(m=>m._lmap&&m._lmap.invalidateSize()),80); p.classList.add('active'); p.setAttribute('aria-hidden','false'); p.querySelectorAll('.num[data-to]').forEach(n=>{ const to=+n.dataset.to; n.textContent=n.dataset.pre; countUp({set textContent(v){ n.textContent=n.dataset.pre+v; }},to,+n.dataset.dec,n.dataset.suf); }); p.querySelectorAll('.fgarc').forEach(a=>{ a.style.strokeDasharray='1 1000'; requestAnimationFrame(()=>requestAnimationFrame(()=>{ a.style.strokeDasharray=a.dataset.dash; })); }); } else { p.classList.remove('active'); p.setAttribute('aria-hidden','true'); } });
  rail.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-current',String(j===i))); const b=rail.querySelectorAll('button')[i]; if(b) b.scrollIntoView({block:'nearest',inline:'nearest'});
  document.getElementById('count').textContent=(i+1)+' / '+CH.length; document.getElementById('progbar').style.width=(100*(i+1)/CH.length)+'%';
  document.getElementById('prev').disabled=i===0; document.getElementById('next').disabled=i===CH.length-1; hideTip();
  const id=CH[i].id; if(location.hash.slice(1)!==id){ try{ history.replaceState(null,'','#'+id);}catch(e){} } }
function go(i){ cur=Math.max(0,Math.min(CH.length-1,i)); show(cur); }
document.getElementById('prev').addEventListener('click',()=>go(cur-1)); document.getElementById('next').addEventListener('click',()=>go(cur+1));
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur+1);} if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1);} });
function setLang(l){ lang=l; try{ localStorage.setItem('pr-lang',l);}catch(e){} panels.forEach(p=>delete p.dataset.built); build(); }
document.getElementById('lang-en').addEventListener('click',()=>setLang('en')); document.getElementById('lang-id').addEventListener('click',()=>setLang('id'));
window.addEventListener('hashchange',()=>{ const i=CH.findIndex(c=>c.id===location.hash.slice(1)); if(i>=0&&i!==cur) go(i); });
let rt; window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const p=panels[cur]; if(p&&p.querySelector('.lmap')){ p.querySelectorAll('.lmap').forEach(m=>m._lmap&&m._lmap.invalidateSize()); panels.forEach((q,j)=>{ if(j!==cur) delete q.dataset.built; }); return; } panels.forEach(q=>delete q.dataset.built); show(cur,true); },200); });
const start=CH.findIndex(c=>c.id===location.hash.slice(1)); cur=start>=0?start:0; build();
})();
</script>
