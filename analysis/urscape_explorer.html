<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="The ur-scape 'West Java' site layers (EV charging, village travel-time access, Rebana kecamatan, Jamali power grid) rendered in the browser, with the ur-scape package to download.">
<title>West Java Layers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Domine:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#F6F4EE;--panel:#FFFFFF;--fg:#13263A;--muted:#55606E;--line:#DAD6CB;--soft:#ECE8DD;--accent:#C97D0E;--fd:'Domine',Georgia,serif;--fs:'IBM Plex Sans',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1B26;--panel:#15283A;--fg:#EDEBE4;--muted:#A7B3BE;--line:#28405A;--soft:#1B3146;--accent:#C4821C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1B26;--panel:#15283A;--fg:#EDEBE4;--muted:#A7B3BE;--line:#28405A;--soft:#1B3146;--accent:#C4821C;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--fs)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .brand{font:700 18px var(--fd)}header .brand span{color:var(--accent)}
header .meta{color:var(--muted);font-size:12.5px;flex:1;min-width:200px}
header a.btn,header select.btn{border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--fg);text-decoration:none;font-weight:600;font-size:12.5px;background:var(--panel)}
header a.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
main{display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px 12px;background:var(--panel)}
aside h3{font:600 10.5px var(--fs);letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
aside h3:first-child{margin-top:4px}
.layer{display:flex;width:100%;align-items:center;gap:8px;padding:5px 6px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted);font:400 13px var(--fs);text-align:left}
.layer:hover{background:var(--soft);color:var(--fg)}
.layer[aria-pressed="true"]{background:var(--soft);color:var(--fg);font-weight:600}
.layer i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c)}
.layer small{margin-left:auto;color:var(--muted);font-weight:400}
#map{min-height:0;position:relative}
#mapdiv{position:absolute;inset:0;background:var(--bg)}
.panel{position:absolute;z-index:500;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;box-shadow:0 2px 10px rgba(0,0,0,.12);max-width:340px}
#legend{left:12px;bottom:28px}#legend b{display:block;font-weight:600;margin-bottom:4px}
#legend .bar{height:10px;border-radius:4px;margin:4px 0}
#legend .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
#legend .cat{display:flex;align-items:center;gap:7px;margin:2px 0}#legend .cat i{width:12px;height:12px;border-radius:3px}
#legend .cite{color:var(--muted);font-size:11px;margin-top:6px;border-top:1px solid var(--line);padding-top:6px}
#read{right:12px;top:12px;min-width:170px;pointer-events:none}#read b{font-size:15px}
#area{right:12px;bottom:28px;max-width:300px}#area table{border-collapse:collapse;font-size:12px;margin-top:6px;width:100%}#area td{padding:2px 6px 2px 0;border-bottom:1px solid var(--line)}#area td.n{text-align:right;font-variant-numeric:tabular-nums}#area .ab{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}#area button,.abtn{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel);color:var(--fg);font:600 12px var(--fs);cursor:pointer}#area button.on,.abtn.on{background:var(--accent);color:#fff;border-color:transparent}
.leaflet-container.draw{cursor:crosshair}
input[type=range]{width:120px;vertical-align:middle;accent-color:var(--accent)}
.opacity{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:8px}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:38vh 1fr}aside{border-right:0;border-bottom:1px solid var(--line)}#read{display:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">ur-scape · <span id="sitename">West Java</span> layers</div>
  <div class="meta" id="meta">Loading layers…</div>
  <select id="sitesel" class="btn" aria-label="ur-scape site"><option value="westjava">Site: West Java (0.5′ ≈ 0.9 km)</option><option value="rebana">Site: Rebana (300 m)</option></select>
  <select id="basesel" class="btn" aria-label="Basemap"></select>
  <a class="btn" href="urscape_guide.html">Panduan ur-scape</a>
  <a class="btn" href="rebana_insights.html">Laporan insight</a>
  <a class="btn" href="rebana_explorer.html">Rebana explorer</a>
  <a class="btn" href="https://ur-scape.com" target="_blank" rel="noopener">ur-scape.com</a>
  <a class="btn" href="../urscape/west-java-layers-qgis.zip" download>QGIS GeoTIFF (zip)</a>
  <a class="btn primary" href="../urscape/ur-scape-west-java.zip" download>Download ur-scape package (zip)</a>
</header>
<main>
  <aside id="list"></aside>
  <div id="map"><div id="mapdiv"></div>
    <div class="panel" id="legend" hidden></div>
    <div class="panel" id="read" hidden></div>
    <div class="panel" id="area" hidden></div>
  </div>
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(async function(){
  const SITE = new URLSearchParams(location.search).get('site')==='rebana' ? 'rebana' : 'westjava';
  const ss=document.getElementById('sitesel'); ss.value=SITE; ss.onchange=e=>location.search=e.target.value==='rebana'?'?site=rebana':'';
  const P = await (await fetch(SITE==='rebana'?'urscape_layers_rebana.json':'urscape_layers.json')).json();
  document.getElementById('sitename').textContent = P.site || 'West Java'; document.title = `${P.site||'West Java'} Layers`;
  const dark = () => document.documentElement.dataset.theme==='dark' || (document.documentElement.dataset.theme!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  const map = L.map('mapdiv',{zoomControl:true,attributionControl:true}).fitBounds(location.hash==='#rebana'?[[-7.15,107.45],[-6.05,108.85]]:[[P.south,P.west],[P.north,P.east]]);
  const BASE={
    gray:{n:'Esri gray',u:()=>`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${dark()?'Dark':'Light'}_Gray_Base/MapServer/tile/{z}/{y}/{x}`,a:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors',mz:16},
    osm:{n:'OpenStreetMap',u:()=>'https://tile.openstreetmap.org/{z}/{x}/{y}.png',a:'© OpenStreetMap contributors',mz:19},
    streets:{n:'Esri streets',u:()=>'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',a:'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors',mz:19},
    imagery:{n:'Esri imagery',u:()=>'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',a:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics',mz:19}};
  let base=null, baseKey='gray'; try{ baseKey=localStorage.getItem('urs-base')||'gray'; }catch(e){}
  const setBase=k=>{ if(!BASE[k]) k='gray'; if(base) map.removeLayer(base); const b=BASE[k]; base=L.tileLayer(b.u(),{attribution:b.a,maxZoom:18,maxNativeZoom:b.mz}).addTo(map); base.bringToBack(); baseKey=k; try{localStorage.setItem('urs-base',k);}catch(e){} };
  setBase(baseKey);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setBase(baseKey));
  const sel=document.getElementById('basesel'); for(const k in BASE){ const o=document.createElement('option'); o.value=k; o.textContent=BASE[k].n; sel.appendChild(o);} sel.value=baseKey; sel.onchange=e=>setBase(e.target.value);
  document.getElementById('meta').textContent = `${P.layers.length} layers · ${P.cx}×${P.cy} cells of ${P.sign==='D'?'300 m':'0.5′ (~0.9 km)'} · same grids as the ur-scape site "${P.site||'West Java'}" · generated ${P.generated.slice(0,4)}-${P.generated.slice(4)}`;

  const b64 = s => { const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; };
  const decode = L0 => { if(!L0.Q){ L0.Q=pako.inflate(b64(L0.q)); L0.R=new Float32Array(pako.inflate(b64(L0.raw)).buffer);} return L0; };
  // ramp: pale -> layer colour -> deep (light theme) | dark -> layer colour -> white (dark theme), like ur-scape on its dark basemap
  const ramp = (rgb,t) => { const [r,g,b]=rgb; const lo = dark()?[20,28,40]:[236,232,222]; const hi = dark()?[255,255,255]:[r*.35,g*.35,b*.35];
    if(t<.5){const k=t/.5; return [lo[0]+(r-lo[0])*k, lo[1]+(g-lo[1])*k, lo[2]+(b-lo[2])*k];} const k=(t-.5)/.5; return [r+(hi[0]-r)*k, g+(hi[1]-g)*k, b+(hi[2]-b)*k]; };
  const catColors = (rgb,n) => Array.from({length:n},(_,i)=>ramp(rgb,n===1?.5:.25+.75*i/(n-1)));

  let overlay=null, cur=null;
  const list=document.getElementById('list'), legend=document.getElementById('legend'), read=document.getElementById('read');
  const groups=[...new Set(P.layers.map(l=>l.group))];
  for(const g of groups){
    const h=document.createElement('h3'); h.textContent=g; list.appendChild(h);
    for(const l of P.layers.filter(x=>x.group===g)){
      const b=document.createElement('button'); b.className='layer'; b.setAttribute('aria-pressed','false');
      b.style.setProperty('--c',`rgb(${l.rgb.join(',')})`); b.innerHTML=`<i></i><span>${l.name}</span><small>${l.units?l.units.split(' ')[0]:'cat'}</small>`;
      b.onclick=()=>show(l,b); list.appendChild(b); l.btn=b;
    }
  }
  const op=document.createElement('div'); op.className='opacity'; op.innerHTML='Opacity <input type="range" min="0.2" max="1" step="0.05" value="0.85">'; list.appendChild(op);
  op.querySelector('input').oninput=e=>overlay&&overlay.setOpacity(+e.target.value);
  // Area summary: draw a polygon, summarise the active layer inside it (same job as ur-scape's Area Inspector)
  const ab=document.createElement('button'); ab.className='abtn'; ab.style.marginTop='10px'; ab.textContent='▱ Area summary'; list.appendChild(ab);
  const area=document.getElementById('area'); let drawing=false, pts=[], poly=null, tmp=null;
  const stopDraw=()=>{ drawing=false; ab.classList.remove('on'); map.getContainer().classList.remove('draw'); if(tmp){map.removeLayer(tmp);tmp=null;} };
  const clearArea=()=>{ stopDraw(); pts=[]; if(poly){map.removeLayer(poly);poly=null;} area.hidden=true; };
  ab.onclick=()=>{ if(drawing){stopDraw();return;} clearArea(); drawing=true; pts=[]; ab.classList.add('on'); map.getContainer().classList.add('draw'); map.doubleClickZoom.disable();
    area.hidden=false; area.innerHTML='<b>Area summary</b><div style="color:var(--muted);font-size:12px">Klik titik-titik poligon di peta, klik ganda untuk selesai.</div>'; };
  const inside=(lat,lng,P0)=>{ let c=false; for(let i=0,j=P0.length-1;i<P0.length;j=i++){ const yi=P0[i][0],xi=P0[i][1],yj=P0[j][0],xj=P0[j][1]; if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)) c=!c; } return c; };
  function summarise(){
    if(!cur||pts.length<3) return; decode(cur);
    const lats=pts.map(p=>p[0]), lngs=pts.map(p=>p[1]);
    const x0=Math.max(0,Math.floor((Math.min(...lngs)-P.west)/P.res)), x1=Math.min(P.cx-1,Math.floor((Math.max(...lngs)-P.west)/P.res));
    const y0=Math.max(0,Math.floor((P.north-Math.max(...lats))/P.res)), y1=Math.min(P.cy-1,Math.floor((P.north-Math.min(...lats))/P.res));
    let n=0,sum=0,mn=Infinity,mx=-Infinity,cells=0; const cat={};
    for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const lat=P.north-(y+.5)*P.res, lng=P.west+(x+.5)*P.res; if(!inside(lat,lng,pts)) continue; cells++;
      const i=y*P.cx+x; if(!cur.Q[i]) continue; const v=cur.R[i]; n++; sum+=v; if(v<mn)mn=v; if(v>mx)mx=v; if(cur.categories){const k=cur.categories[Math.round(v)-1]; cat[k]=(cat[k]||0)+1;} }
    const kmcell=(P.sign==='D'?0.3*0.3:0.9265*0.9265*Math.cos(((lats[0])*Math.PI)/180)); // km² per cell (approx.)
    let rows=`<tr><td>Cells inside</td><td class="n">${cells.toLocaleString()} (${(cells*kmcell).toLocaleString(undefined,{maximumFractionDigits:0})} km²)</td></tr><tr><td>Cells with data</td><td class="n">${n.toLocaleString()} (${cells?Math.round(100*n/cells):0}%)</td></tr>`;
    if(n){ if(cur.categories) rows+=Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td class="n">${v.toLocaleString()} (${Math.round(100*v/n)}%)</td></tr>`).join('');
      else rows+=`<tr><td>Minimum</td><td class="n">${fmt(mn)}</td></tr><tr><td>Mean</td><td class="n">${fmt(sum/n)}</td></tr><tr><td>Maximum</td><td class="n">${fmt(mx)}</td></tr><tr><td>Sum</td><td class="n">${fmt(sum)}</td></tr>`+(/per km/.test(cur.units||'')?`<tr><td>≈ Total (sum × cell area)</td><td class="n">${fmt(sum*kmcell)}</td></tr>`:''); }
    area.hidden=false; area.innerHTML=`<b>Area summary · ${cur.name}</b><div style="color:var(--muted);font-size:11.5px">${cur.units||'category'} · ${pts.length} vertices</div><table>${rows}</table><div class="ab"><button id="acsv">Copy CSV</button><button id="aclr">Clear</button></div>`;
    document.getElementById('aclr').onclick=clearArea;
    document.getElementById('acsv').onclick=()=>{ const t=`layer,units,cells,cells_with_data,min,mean,max,sum\n${cur.name},${cur.units||''},${cells},${n},${n?mn:''},${n?sum/n:''},${n?mx:''},${n?sum:''}`; navigator.clipboard&&navigator.clipboard.writeText(t); };
  }
  map.on('click',e=>{ if(!drawing) return; pts.push([e.latlng.lat,e.latlng.lng]); if(tmp) map.removeLayer(tmp); tmp=L.polyline(pts,{color:'#fff',weight:2,dashArray:'4 4'}).addTo(map); });
  map.on('dblclick',e=>{ if(!drawing) return; while(pts.length>1&&pts.at(-1)[0]===pts.at(-2)[0]&&pts.at(-1)[1]===pts.at(-2)[1]) pts.pop(); if(pts.length>=3){ stopDraw(); if(poly) map.removeLayer(poly); poly=L.polygon(pts,{color:'#fff',weight:2,fillOpacity:.08}).addTo(map); summarise(); } setTimeout(()=>map.doubleClickZoom.enable(),300); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&drawing) clearArea(); });

  function show(l,btn){
    decode(l); cur=l; if(poly&&pts.length>=3) setTimeout(summarise,0);
    for(const x of P.layers) x.btn.setAttribute('aria-pressed',x===l?'true':'false');
    const cv=document.createElement('canvas'); cv.width=P.cx; cv.height=P.cy; const ctx=cv.getContext('2d'); const img=ctx.createImageData(P.cx,P.cy);
    const cols = l.categories ? catColors(l.rgb,l.categories.length) : null;
    for(let i=0;i<l.Q.length;i++){ const q=l.Q[i]; if(!q) continue; const c = cols ? cols[q-1] : ramp(l.rgb,(q-1)/254); img.data[i*4]=c[0]; img.data[i*4+1]=c[1]; img.data[i*4+2]=c[2]; img.data[i*4+3]=255; }
    ctx.putImageData(img,0,0);
    if(overlay) map.removeLayer(overlay);
    overlay=L.imageOverlay(cv.toDataURL(),[[P.south,P.west],[P.north,P.east]],{opacity:+op.querySelector('input').value,interactive:false}).addTo(map);
    // legend
    legend.hidden=false;
    if(l.categories){ legend.innerHTML=`<b>${l.name}</b>`+l.categories.map((c,i)=>`<div class="cat"><i style="background:rgb(${cols[i].map(Math.round).join(',')})"></i>${c}</div>`).join('')+`<div class="cite">${l.citation}</div>`; }
    else { const g=`linear-gradient(90deg,${[0,.25,.5,.75,1].map(t=>`rgb(${ramp(l.rgb,t).map(Math.round).join(',')})`).join(',')})`;
      legend.innerHTML=`<b>${l.name}</b><div class="bar" style="background:${g}"></div><div class="ends"><span>${fmt(l.lo)}</span><span>${l.units}</span><span>${fmt(l.hi)}+</span></div><div class="cite">${l.cells.toLocaleString()} cells · range ${fmt(l.min)}–${fmt(l.max)} (colour ramp 2–98th pct) · ${l.citation}</div>`; }
  }
  const fmt=v=>v==null?'–':Math.abs(v)>=1000?Math.round(v).toLocaleString():(Math.round(v*100)/100).toString();
  map.on('mousemove',e=>{ if(!cur) return; const x=Math.floor((e.latlng.lng-P.west)/P.res), y=Math.floor((P.north-e.latlng.lat)/P.res);
    if(x<0||y<0||x>=P.cx||y>=P.cy||!cur.Q[y*P.cx+x]){ read.hidden=true; return; }
    const v=cur.R[y*P.cx+x]; read.hidden=false;
    read.innerHTML=`<div style="color:var(--muted)">${cur.name}</div><b>${cur.categories?cur.categories[Math.round(v)-1]:fmt(v)+' '+(cur.units||'')}</b><div style="color:var(--muted);font-size:11px">${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}</div>`; });
  map.on('mouseout',()=>read.hidden=true);
  const first=P.layers.find(l=>l.name==='Travel Time to Nearest Charger')||P.layers[0]; show(first,first.btn);
})();
</script>
</body>
</html>
